plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.naegi9.scsplocal'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.naegi9.scsplocal'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1-test'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -fexceptions -frtti'
                arguments '-DANDROID_STL=c++_static', '-DCMAKE_BUILD_TYPE=Release'
            }
        }
    }

    buildFeatures { prefab true }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }

    packaging {
        jniLibs { useLegacyPackaging false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'com.bytedance.android:shadowhook:1.0.10'
}
